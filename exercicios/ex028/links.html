<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>

    <style>

        /* SELETORES PERSONALIZADOS
         # = id
         . = class
         : = pseudo-classe
         :: = pseudo-element
         > = clildren
         */
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: aqua;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: rgb(32, 3, 102);
        }

        a:hover {
           color: black;
           text-decoration: underline;
        }

        a:active {
            color: cadetblue;
        }

        .especial::before {
            content: '→';
        }

        .especial::after {
            content: '←';
        }

        .especial {
            background-color: brown;
        }
        
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/gustavoguanabara" target="_blank">Repositório GitHub</a></li>
        <li><a href="https://www.youtube.com/@cursoemvideo" class="especial">Canal do You Tube</a></li>
        <li><a href="https://www.cursoemvideo.com/" class="especial">Site do CursoemVideo</a></li>
    </ul>
    
</body>
</html>
