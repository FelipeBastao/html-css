<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>

    <style>
        @font-face {
            font-family: 'Love';
            src: url('Bunny\ Gloff\ PERSONAL\ USE\ ONLY!.ttf') format('opentype'), url('Bunny\ Gloff\ PERSONAL\ USE\ ONLY!.ttf');
            font-weight: normal;
            font-style: normal;
        }
        /*
         Tipos de format()
         -opentype (otf)
         -truetype(ttf)
         -embedded-opentype
         -truetype-aat (Apple Advanced Typography)
         -svg
         */
        body {
            font-family: Arial, Helvetica, sans-serif;
            
        }

        h1 {
            font-family: 'Love', Times, serif;
            font-size: xx-large;
            font-weight:normal;
        }
    </style>
</head>
<body>
    <h1>Olá,Mundo</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Eum laudantium excepturi dignissimos commodi id sapiente ullam odit, asperiores ipsum! Quia veritatis nam dicta dolore doloremque ipsa voluptatem debitis non harum!</p>
</body>
</html>
